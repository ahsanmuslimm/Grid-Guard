# GridGuard — Cloud Build Configuration
# Triggered automatically by: gcloud run deploy gridguard --source .

steps:
  # Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gridguard:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gridguard:latest'
      - '-f'
      - 'deploy/Dockerfile'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/gridguard:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gridguard'
      - '--image=gcr.io/$PROJECT_ID/gridguard:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_REGION=us-central1,GRIDGUARD_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/gridguard:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gridguard:latest'

timeout: '1200s'
